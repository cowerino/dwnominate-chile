<text x="289.00" y="152.93" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="9" font-weight="400" text-anchor="middle">centrar y alinear sin reescalar</text>
<text x="289.00" y="163.73" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="8" font-weight="400" text-anchor="middle">alineación ortogonal; map_agreement.py</text>
<rect x="205" y="236" width="168" height="52" rx="0" fill="white" stroke="#202020" stroke-width=".7"/>
<text x="289.00" y="250.00" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="9.5" font-weight="400" text-anchor="middle">Medidas de acuerdo</text>
