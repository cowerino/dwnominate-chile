<text x="94.00" y="195.53" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="9" font-weight="400" text-anchor="middle">sin volver a ajustar: cero ciclos</text>
<text x="94.00" y="206.33" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="8" font-weight="400" text-anchor="middle">standalone, modo evaluate</text>
