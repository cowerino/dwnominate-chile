<text x="211.00" y="266.00" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="9" font-weight="400" text-anchor="start">n emparejados, r1, r2,</text>
<text x="211.00" y="277.00" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="9" font-weight="400" text-anchor="start">amplitud y distancia media</text>
