<polyline points="8,410 374.6771653543307,410" fill="none" stroke="rgb(30,30,30)" stroke-width="0.7"/>
<text x="8.00" y="420.00" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="8.5" font-weight="400" text-anchor="start">Rectángulo redondeado: acción. Rectángulo: objeto de datos. Flecha continua: flujo de objetos.</text>
<text x="8.00" y="430.50" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="8.5" font-weight="400" text-anchor="start">LL: log-verosimilitud; r1 y r2: correlación por dimensión tras alinear; amplitud: razón de</text>
<text x="8.00" y="441.00" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="8.5" font-weight="400" text-anchor="start">tamaños. Alineación ortogonal: rotación o reflexión, sin reescalar. Ambas corridas usan la semilla</text>
<text x="8.00" y="451.50" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="8.5" font-weight="400" text-anchor="start">por legislador. El referente de corridas es wmay, no el original 2004.</text>
