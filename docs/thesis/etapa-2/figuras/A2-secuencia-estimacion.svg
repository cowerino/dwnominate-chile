<svg xmlns="http://www.w3.org/2000/svg" width="135mm" height="179.917mm" viewBox="0 0 382.677 510">
<rect width="100%" height="100%" fill="white"/>
<title>A2</title>
<desc>Secuencia de una estimación con el motor fiel desde el portal R. La CLI carga y valida las entradas (inicialización: semillas, beta y W2, el peso de la segunda dimensión), crea el motor con la configuración y los datos, ejecuta los ciclos y exporta parámetros terminales y un resumen mixto (M-02); si loadInput o run() lanzan una excepción, termina con código 1 y sin salidas (el constructor y la exportación están fuera de esos bloques try). El portal acepta el resultado solo si el código de salida es cero y las coordenadas, los parámetros y el resumen existen y se pueden leer; no valida su cobertura completa ni todo su esquema. En la llamada, faithful_mode = &quot;wmay&quot; añade --wmay-replication (linaje wmay, salvaguarda GRID apagada). El paralelismo con OpenMP es una capacidad del motor; la corrida comparativa usa un hilo.</desc>
