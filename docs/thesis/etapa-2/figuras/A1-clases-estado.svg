<svg xmlns="http://www.w3.org/2000/svg" width="135mm" height="173.567mm" viewBox="0 0 382.677 492">
<rect width="100%" height="100%" fill="white"/>
<title>A1</title>
<desc>Clases y propiedad del estado del motor fiel. CSVLoader crea la entrada; DWNominate copia de ella lo que necesita en el constructor (votos, coordenadas, puntos medios y dispersiones) y no retiene el objeto DWNominateInput; posee por valor la configuración, los metadatos de periodos y la presencia de legisladores, usa las búsquedas como funciones libres y crea el resultado, que lleva el estado terminal, al terminar. La CLI construye la configuración y deja apagados sus tres modos de validación, que fijan un bloque de parámetros para la verificación por componente (solo el motor moderno los expone como banderas). use2004GridSafeguard activa la salvaguarda GRID de 2004: encendida por defecto, --wmay-replication la apaga. Se muestran miembros seleccionados, ordenados por fase.</desc>
<rect x="8" y="10" width="152" height="56" rx="0" fill="white" stroke="#202020" stroke-width=".7"/>
