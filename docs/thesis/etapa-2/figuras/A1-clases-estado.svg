<text x="8.00" y="426.00" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="8.5" font-weight="400" text-anchor="start">Rombo lleno: composición; la parte es un valor propiedad de DWNominate, con la multiplicidad</text>
<text x="8.00" y="436.50" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="8.5" font-weight="400" text-anchor="start">(sobre la línea) y el nombre de rol (bajo ella) en el extremo de la parte. Flecha discontinua:</text>
<text x="8.00" y="447.00" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="8.5" font-weight="400" text-anchor="start">dependencia, no propiedad; el constructor copia de la entrada los votos, las coordenadas y los</text>
<text x="8.00" y="457.50" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="8.5" font-weight="400" text-anchor="start">parámetros de votación, y no la retiene. El parámetro inicialización de loadInput lleva semillas,</text>
<text x="8.00" y="468.00" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="8.5" font-weight="400" text-anchor="start">beta y W2 (peso de la segunda dimensión). La CLI construye DWNominateConfig y deja</text>
<text x="8.00" y="478.50" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="8.5" font-weight="400" text-anchor="start">apagados los modos de validación (fixGlobalParams, fixRollCalls, fixLegislators), que fijan un</text>
<text x="8.00" y="489.00" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="8.5" font-weight="400" text-anchor="start">bloque. «Utility»: funciones libres agrupadas, no una clase del código.</text>
