<svg xmlns="http://www.w3.org/2000/svg" width="135mm" height="169.333mm" viewBox="0 0 382.677 480">
<rect width="100%" height="100%" fill="white"/>
<title>F6</title>
<desc>Modelo conceptual de los datos y del tiempo servido. Un legislador tiene una fila por periodo servido; cada fila contiene las celdas de voto de las votaciones válidas de ese periodo. La semilla por legislador y la semilla por fila son contratos distintos. Cada legislador con al menos un periodo servido tiene una trayectoria, que se evalúa solo en los periodos servidos con un tiempo local que recorre ese intervalo; el término lineal exige al menos cinco periodos servidos (el cuadrático seis y el cúbico siete) y con menos el modelo efectivo es constante. Es un modelo conceptual, no una base de datos.</desc>
