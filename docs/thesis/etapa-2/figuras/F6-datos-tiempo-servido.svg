<text x="8.00" y="454.50" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="8.5" font-weight="400" text-anchor="start">Flecha discontinua «Derive»: las coordenadas de la fila se derivan de la trayectoria y del tiempo</text>
<text x="8.00" y="465.00" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="8.5" font-weight="400" text-anchor="start">local. Archivos, columnas y signos corregidos en el cuadro de contratos del anexo.</text>
