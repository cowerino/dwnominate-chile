<svg xmlns="http://www.w3.org/2000/svg" width="135mm" height="170.039mm" viewBox="0 0 382.677 482">
<rect width="100%" height="100%" fill="white"/>
<title>F4</title>
<desc>Ciclo de estimación compartido por wmay y el motor fiel. Cada ciclo ajusta los parámetros globales, actualiza las posiciones de las votaciones, evalúa la verosimilitud, actualiza las posiciones de los legisladores y vuelve a evaluar; el número de ciclos es fijo y no hay prueba de convergencia. El estado terminal es el conjunto de parámetros al terminar el último ciclo. El resumen fiel mezcla la LL terminal con clasificación de la fase previa (M-02, pendiente de I2). Compartir este flujo no garantiza cifras iguales entre implementaciones. Perfil de la vista: dos dimensiones y cuatro ciclos.</desc>
