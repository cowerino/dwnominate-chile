<text x="14.00" y="69.00" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start">Same panel, per-legislator seeds and cycle horizon</text>
<text x="93.00" y="111.00" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">COMMON EVALUATOR</text>
<text x="290.00" y="111.00" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">MAP AGREEMENT</text>
